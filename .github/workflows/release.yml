# Builds a release and publishes it in this repository, where the app checks for updates. It runs only from the Actions
# tab (Release → Run workflow, on main, with the version), and only for the repository's owner.
#
# The release notes are release/notes/<version>.md, committed before running it, so only what's written there is public.
#
# Needs, in this repository's Settings → Secrets and variables → Actions:
#   - secret UPDATE_SIGNING_KEY: the private key from scripts/make-update-key.swift, whose public half is in App/Info.plist
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, like 0.7.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and its notes
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are built from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version should look like 0.7.0, not $VERSION."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released."
            exit 1
          fi
          if [ ! -s "release/notes/$VERSION.md" ]; then
            echo "::error::release/notes/$VERSION.md, with the notes for the people who use Bekitzur, isn't on main."
            exit 1
          fi

      - name: Reuse downloaded packages and frameworks
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

      - name: Package
        run: BEKITZUR_VERSION="$VERSION" scripts/package.sh

      - name: Describe and sign the release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/Bekitzur.app/Contents/Info.plist)
          sha=$(shasum -a 256 build/Bekitzur.zip | cut -d' ' -f1)
          signature=$(swift scripts/sign-update.swift "$VERSION" "$build" "$sha")
          python3 - "$VERSION" "$build" "$sha" "$signature" "$GITHUB_REPOSITORY" <<'EOF'
          import json, sys
          version, build, sha, signature, repo = sys.argv[1:]
          notes = open(f"release/notes/{version}.md", encoding="utf-8").read().strip()
          json.dump({
              "version": version,
              "build": build,
              "url": f"https://github.com/{repo}/releases/download/v{version}/Bekitzur.zip",
              "sha256": sha,
              "notes": notes,
              "signature": signature,
          }, open("build/update.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF
          cat build/update.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Bekitzur.zip build/update.json --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Bekitzur $VERSION" --notes-file "release/notes/$VERSION.md"
