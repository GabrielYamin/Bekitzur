# Builds and tests each pull request to main, and main itself. The ruleset on main requires its "Build and test" check
# to pass before a pull request is merged. It packages the app as a release does, so a change that would break a release
# fails here first. It uses no secrets, so pull requests from forks run it as they are.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reuse downloaded packages and frameworks
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

      - name: Package
        run: scripts/package.sh
